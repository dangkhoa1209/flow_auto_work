stages:
  - check
  - build

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - apps/web/node_modules/
      - apps/api/node_modules/
      - packages/shared/node_modules/

typecheck:
  stage: check
  script:
    - npm ci
    - npm run typecheck

test:
  stage: check
  script:
    - npm ci
    - npm test

build_web:
  stage: build
  script:
    - npm ci
    - npm run build:web
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 week
